name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste an API key.** The support report (Settings → Support report) masks keys and user folders; review it before pasting.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Model Switcher version
      placeholder: "0.2.1 (bottom-left of the sidebar)"
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Which app is affected?
      multiple: true
      options: [Codex CLI, Codex Desktop, Claude Code, Claude Desktop, Orca, Model Switcher itself]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: Steps to reproduce, the message you saw, screenshots.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Support report
      description: Settings → Support report. Optional but very helpful.
      render: json
